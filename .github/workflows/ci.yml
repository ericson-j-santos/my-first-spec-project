name: CI — my-first-spec-project

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  validate-specs:
    name: Validate SDD Structure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::README.md não encontrado no repositório"
            exit 1
          fi
          echo "✅ README.md encontrado"

      - name: Check GEMINI.md exists
        run: |
          if [ ! -f "GEMINI.md" ]; then
            echo "::error::GEMINI.md não encontrado"
            exit 1
          fi
          echo "✅ GEMINI.md encontrado"

      - name: Check .sdd structure
        run: |
          if [ ! -d ".sdd" ]; then
            echo "::warning::.sdd/ ainda não inicializado — execute /sdd:spec-init para começar"
          else
            echo "✅ Estrutura .sdd/ encontrada"
            ls -la .sdd/
          fi

      - name: Validate canonical spec metadata and dashboard
        run: python scripts/sdd_status.py --check

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  Validação SDD concluída com sucesso ✅"
          echo "  Repositório: ericson-j-santos/my-first-spec-project"
          echo "═══════════════════════════════════════════"
